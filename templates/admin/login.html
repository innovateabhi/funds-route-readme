<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FundsRoute Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #07132F;

            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 360px;

            padding: 32px;

            background: white;

            border-radius: 12px;

            box-shadow: 0 20px 50px rgba(0,0,0,.25);
        }

        h1 {
            margin: 0 0 6px;

            color: #07132F;

            font-size: 24px;
        }

        p {
            margin: 0 0 25px;

            color: #718096;

            font-size: 14px;
        }

        label {
            display: block;

            margin-bottom: 6px;

            font-size: 13px;

            color: #344256;
        }

        input {
            width: 100%;

            padding: 11px 12px;

            margin-bottom: 16px;

            border: 1px solid #DDE4EE;

            border-radius: 7px;

            outline: none;
        }

        input:focus {
            border-color: #086CFF;
        }

        button {
            width: 100%;

            padding: 12px;

            border: 0;

            border-radius: 7px;

            background: #086CFF;

            color: white;

            font-weight: 600;

            cursor: pointer;
        }

        .error {
            margin-bottom: 15px;

            padding: 10px;

            border-radius: 6px;

            background: #fee2e2;

            color: #b91c1c;

            font-size: 13px;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>FundsRoute Admin</h1>

        <p>KYC Verification Panel</p>

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="error">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}

        <form method="POST">

            <label>Username</label>

            <input
                type="text"
                name="username"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>

</html>
