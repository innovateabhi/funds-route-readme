<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="One India - Secure global money transfers from India."
    >

    <title>
        {% block title %}
        One India to Global Remittance
        {% endblock %}
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/main.css') }}"
    >

    {% block styles %}
    {% endblock %}

</head>

<body>

    {% block body %}
    {% endblock %}

    <script src="https://unpkg.com/lucide@latest"></script>

    <script
        src="{{ url_for('static', filename='js/main.js') }}">
    </script>

    {% block scripts %}
    {% endblock %}

</body>

</html>
